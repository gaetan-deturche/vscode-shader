name: Compile
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile

      # Only build the installable .vsix on a tag push (e.g. v1.1.5)
      - name: Package VSIX
        if: startsWith(github.ref, 'refs/tags/')
        run: npx --yes @vscode/vsce package --allow-missing-repository
      - name: Upload VSIX
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
